services:
  vllm:
    image: vllm/vllm-openai:v0.33.0
    restart: unless-stopped
    ipc: host
    environment:
      VLLM_API_KEY: ${SHINKA_AI_API_KEY:?Define SHINKA_AI_API_KEY en el archivo .env}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - model-cache:/root/.cache/huggingface
    command:
      - --model
      - openai/gpt-oss-20b
      - --served-model-name
      - shinka-gpt-oss-20b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - "0.90"
      - --reasoning-parser
      - openai_gptoss
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8).read()"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SHINKA_ENGINE_DOMAIN: ${SHINKA_ENGINE_DOMAIN:?Define SHINKA_ENGINE_DOMAIN en el archivo .env}
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  model-cache:
  caddy-data:
  caddy-config:
